<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کاژه | منوی دیجیتال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --black:#121212;--black-2:#1E1B19;--white:#FFFFFF;--paper:#F6F3EF;
    --brown:#6B4226;--brown-dark:#4A2C18;--brown-light:#A9744F;--ink:#1A1310;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,var(--black-2),var(--black) 65%);
    color:var(--ink);min-height:100%;display:flex;justify-content:center;
  }
  .sheet{width:100%;max-width:480px;padding:24px 16px 50px}
  header{text-align:center;color:var(--white);padding:14px 6px 22px}
  .brand-mark{width:44px;height:44px;margin:0 auto 10px;border:2px solid var(--brown-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:1.45rem;font-weight:800}
  header p{font-size:.8rem;color:var(--brown-light);margin-top:4px;font-weight:500}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{
    aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--brown);cursor:pointer;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;padding:6px;background:var(--black);color:var(--white);
  }
  .tile:nth-child(even){background:var(--paper);color:var(--ink);border-color:var(--brown-light)}
  .tile:active{transform:scale(.97)}
  .tile .icon{font-size:1.7rem;color:var(--brown-light)}
  .tile:nth-child(even) .icon{color:var(--brown)}
  .tile .label{font-size:.82rem;font-weight:700;text-align:center;line-height:1.3}

  .qr-block{margin-top:20px;padding:18px;border-radius:10px;background:var(--black);border:1.5px solid var(--brown);color:var(--white);display:flex;align-items:center;gap:14px}
  .qr-block #qr{background:#fff;padding:6px;border-radius:6px;line-height:0}
  .qr-text b{display:block;font-size:.88rem;margin-bottom:3px}
  .qr-text span{font-size:.74rem;color:var(--brown-light)}
  .hint{text-align:center;font-size:.72rem;color:var(--brown-light);margin-top:14px}
  footer{text-align:center;padding:16px 10px 0;font-size:.72rem;color:var(--brown-light)}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="brand-mark">☕</div>
    <h1>کاژه</h1>
    <p>یک دسته رو انتخاب کنید</p>
  </header>

  <div class="tiles">
    <button class="tile hot" data-cat="hot"><span class="icon">☕</span><span class="label">بار گرم</span></button>
    <button class="tile cold" data-cat="cold"><span class="icon">🧊</span><span class="label">بار سرد</span></button>
    <button class="tile dessert" data-cat="dessert"><span class="icon">🍹</span><span class="label">آبمیوه‌ها</span></button>
    <button class="tile tea" data-cat="tea"><span class="icon">🍵</span><span class="label">چای و دمنوش</span></button>
    <button class="tile shake" data-cat="shake"><span class="icon">🥤</span><span class="label">شیک</span></button>
    <button class="tile icecream" data-cat="icecream"><span class="icon">🍳</span><span class="label">صبحانه</span></button>
  </div>

  <div class="qr-block">
    <div id="qr"></div>
    <div class="qr-text"><b>اسکن کنید</b><span>برای دیدن منو روی گوشی خودتون</span></div>
  </div>
  <footer>این یک منوی نمونه است — آیتم‌ها و قیمت‌ها قابل جایگزینی هستند</footer>
</div>

<script>
  var CATS = {
    hot: {title:'بار گرم', a:'#8A4A22', b:'#4A2510', items:[
      {n:'اسپرسو سینگل', p:'—'},
      {n:'اسپرسو دبل', p:'—'},
      {n:'لته', p:'—'},
      {n:'کاپوچینو', p:'—'},
      {n:'موکا', p:'—'},
      {n:'ماکیاتو', p:'—'},
      {n:'هات چاکلت', p:'—'},
      {n:'آمریکانو', p:'—'},
      {n:'ماسالا', p:'—'},
      {n:'نسکافه', p:'—'},
      {n:'وایت چاکلت', p:'—'},
      {n:'شیر دارچین', p:'—'}
    ]},
    cold: {title:'بار سرد', a:'#3E6E72', b:'#1F3E42', items:[
      {n:'آیس کارامل ماکیاتو', p:'—'},
      {n:'آیس لته', p:'—'},
      {n:'آیس آمریکانو', p:'—'},
      {n:'آیس موکا', p:'—'},
      {n:'هایپ اسپرسو', p:'—'}
    ]},
    dessert: {title:'آبمیوه‌ها', a:'#8A5A3A', b:'#4E2E1A', items:[
      {n:'لیموناد', p:'—'},
      {n:'موهیتو', p:'—'},
      {n:'رد موهیتو', p:'—'},
      {n:'شیرموز', p:'—'},
      {n:'آب پرتقال', p:'—'}
    ]},
    tea: {title:'چای و دمنوش', a:'#5C7A3E', b:'#2E4420', items:[
      {n:'گل گاوزبان', p:'—'},
      {n:'بابونه', p:'—'},
      {n:'دمنوش سرماخوردگی', p:'—'},
      {n:'چای بزرگ + نبات', p:'—'},
      {n:'چای کوچک', p:'—'}
    ]},
    shake: {title:'شیک', a:'#A2653F', b:'#5A3218', items:[
      {n:'شیک وانیل', p:'—'},
      {n:'شیک نوتلا', p:'—'},
      {n:'شیک توت فرنگی', p:'—'},
      {n:'شیک قهوه', p:'—'},
      {n:'شیک بادام زمینی', p:'—'}
    ]},
    icecream: {title:'صبحانه', a:'#4E85A0', b:'#26485A', items:[
      {n:'نیمرو', p:'—'},
      {n:'املت', p:'—'},
      {n:'سوسیس تخم‌مرغ', p:'—'}
    ]}
  };

  function pageHTML(cat){
    var c = CATS[cat];
    var rows = c.items.map(function(it){
      return '<div class="item"><div class="item-top"><span class="item-name">'+it.n+'</span><span class="leader"></span><span class="price">'+it.p+'</span></div>'+
        (it.d ? '<div class="item-desc">'+it.d+'</div>' : '')+'</div>';
    }).join('');
    return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">'+
      '<title>'+c.title+' | کاژه</title>'+
      '<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">'+
      '<style>'+
      'body{font-family:"Vazirmatn",sans-serif;background:linear-gradient(180deg,#1E1B19,#121212 65%);margin:0;min-height:100vh;display:flex;justify-content:center;color:#1A1310}'+
      '.wrap{width:100%;max-width:480px;padding:24px 16px 50px}'+
      '.head{background:#121212;border:1.5px solid #6B4226;color:#FFFFFF;border-radius:10px;padding:22px;text-align:center;margin-bottom:16px;position:relative}'+
      '.head h1{margin:0;font-size:1.3rem;font-weight:800}'+
      '.close-btn{position:absolute;top:12px;left:12px;background:transparent;border:1.5px solid #A9744F;color:#FFFFFF;border-radius:8px;padding:6px 12px;font-family:"Vazirmatn",sans-serif;font-size:.8rem;cursor:pointer}'+
      '.box{background:#F6F3EF;border:1.5px solid #A9744F;border-radius:10px;padding:6px 18px 8px}'+
      '.item{padding:12px 0;border-bottom:1px dashed #D9CEC2}'+
      '.item:last-child{border-bottom:none}'+
      '.item-top{display:flex;align-items:baseline;gap:8px}'+
      '.item-name{font-weight:700;font-size:.96rem;white-space:nowrap}'+
      '.leader{flex:1;border-bottom:1px dotted #A9744F;transform:translateY(-3px)}'+
      '.price{font-weight:700;font-size:.92rem;color:#6B4226;white-space:nowrap}'+
      '.item-desc{font-size:.76rem;color:#4A2C18;margin-top:3px;line-height:1.5}'+
      '</style></head><body><div class="wrap"><div class="head"><button class="close-btn" onclick="window.close()">بازگشت</button><h1>'+c.title+'</h1></div><div class="box">'+rows+'</div></div></body></html>';
  }

  document.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('click', function(){
      var win = window.open('', '_blank');
      if(win){
        win.document.write(pageHTML(t.dataset.cat));
        win.document.close();
      } else {
        alert('مرورگرتون باز شدن پنجره جدید رو مسدود کرده. لطفاً پاپ‌آپ رو برای این سایت فعال کنید.');
      }
    });
  });

  try{
    new QRCode(document.getElementById('qr'), {
      text: window.location.href, width: 80, height: 80,
      colorDark: '#2E1C10', colorLight: '#ffffff'
    });
  }catch(e){
    document.getElementById('qr').innerText = '—';
  }
</script>
</body>
</html>
