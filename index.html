<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه بلوط | منوی دیجیتال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --wood-dark:#2E1C10;--wood-mid:#6E4423;--oak:#C89A63;
    --paper:#F2E4C7;--paper-2:#EAD9B4;--rust:#A2481C;--ink:#2A1B10;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,var(--wood-mid),var(--wood-dark) 60%);
    color:var(--ink);min-height:100%;display:flex;justify-content:center;
  }
  .sheet{width:100%;max-width:480px;padding:24px 16px 50px}
  header{text-align:center;color:var(--paper);padding:14px 6px 22px}
  .brand-mark{width:44px;height:44px;margin:0 auto 10px;border:2px solid var(--oak);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:1.45rem;font-weight:800}
  header p{font-size:.8rem;color:var(--oak);margin-top:4px;font-weight:500}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{
    aspect-ratio:1/1;border-radius:10px;border:none;cursor:pointer;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--paper);font-family:inherit;padding:6px;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0.10) 0 3px, transparent 3px 34px),
      linear-gradient(160deg,var(--tile-a,#7A4B28),var(--tile-b,#4A2C15));
  }
  .tile:active{transform:scale(.97)}
  .tile .icon{font-size:1.7rem}
  .tile .label{font-size:.82rem;font-weight:700;text-align:center;line-height:1.3}
  .tile.hot{--tile-a:#8A4A22;--tile-b:#4A2510}
  .tile.cold{--tile-a:#3E6E72;--tile-b:#1F3E42}
  .tile.dessert{--tile-a:#8A5A3A;--tile-b:#4E2E1A}
  .tile.tea{--tile-a:#5C7A3E;--tile-b:#2E4420}
  .tile.shake{--tile-a:#A2653F;--tile-b:#5A3218}
  .tile.icecream{--tile-a:#4E85A0;--tile-b:#26485A}

  .qr-block{margin-top:20px;padding:18px;border-radius:10px;background:var(--wood-dark);color:var(--paper);display:flex;align-items:center;gap:14px}
  .qr-block #qr{background:#fff;padding:6px;border-radius:6px;line-height:0}
  .qr-text b{display:block;font-size:.88rem;margin-bottom:3px}
  .qr-text span{font-size:.74rem;color:var(--oak)}
  .hint{text-align:center;font-size:.72rem;color:var(--oak);margin-top:14px}
  footer{text-align:center;padding:16px 10px 0;font-size:.72rem;color:var(--oak)}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="brand-mark">☕</div>
    <h1>کافه بلوط</h1>
    <p>یک دسته رو انتخاب کنید</p>
  </header>

  <div class="tiles">
    <button class="tile hot" data-cat="hot"><span class="icon">☕</span><span class="label">نوشیدنی گرم</span></button>
    <button class="tile cold" data-cat="cold"><span class="icon">🧊</span><span class="label">نوشیدنی سرد</span></button>
    <button class="tile dessert" data-cat="dessert"><span class="icon">🍰</span><span class="label">دسر و کیک</span></button>
    <button class="tile tea" data-cat="tea"><span class="icon">🍵</span><span class="label">چای و دمنوش</span></button>
    <button class="tile shake" data-cat="shake"><span class="icon">🥤</span><span class="label">شیک</span></button>
    <button class="tile icecream" data-cat="icecream"><span class="icon">🍨</span><span class="label">بستنی</span></button>
  </div>

  <div class="qr-block">
    <div id="qr"></div>
    <div class="qr-text"><b>اسکن کنید</b><span>برای دیدن منو روی گوشی خودتون</span></div>
  </div>
  <footer>این یک منوی نمونه است — آیتم‌ها و قیمت‌ها قابل جایگزینی هستند</footer>
</div>

<script>
  var CATS = {
    hot: {title:'نوشیدنی گرم', a:'#8A4A22', b:'#4A2510', items:[
      {n:'اسپرسو', p:'۴۵,۰۰۰'},
      {n:'آمریکانو', p:'۵۰,۰۰۰'},
      {n:'کاپوچینو', p:'۶۵,۰۰۰', d:'با فوم شیر و کمی دارچین'},
      {n:'لاته', p:'۷۰,۰۰۰'},
      {n:'موکا', p:'۷۵,۰۰۰', d:'اسپرسو، شکلات تلخ و شیر'}
    ]},
    cold: {title:'نوشیدنی سرد', a:'#3E6E72', b:'#1F3E42', items:[
      {n:'آیس آمریکانو', p:'۵۵,۰۰۰'},
      {n:'آیس لاته', p:'۷۵,۰۰۰'},
      {n:'آفوگاتو', p:'۸۵,۰۰۰', d:'یک اسکوپ بستنی وانیل با اسپرسوی داغ'},
      {n:'کلد برو', p:'۸۰,۰۰۰'}
    ]},
    dessert: {title:'دسر و کیک', a:'#8A5A3A', b:'#4E2E1A', items:[
      {n:'چیزکیک', p:'۹۰,۰۰۰'},
      {n:'براونی', p:'۷۵,۰۰۰'},
      {n:'تیرامیسو', p:'۹۵,۰۰۰'},
      {n:'کیک شکلاتی', p:'۸۵,۰۰۰'}
    ]},
    tea: {title:'چای و دمنوش', a:'#5C7A3E', b:'#2E4420', items:[
      {n:'چای سیاه', p:'۳۵,۰۰۰'},
      {n:'دمنوش زنجبیل', p:'۴۰,۰۰۰'},
      {n:'چای ماسالا', p:'۴۵,۰۰۰', d:'ترکیب ادویه‌های گرم با چای سیاه'},
      {n:'دمنوش بابونه', p:'۴۰,۰۰۰'}
    ]},
    shake: {title:'شیک', a:'#A2653F', b:'#5A3218', items:[
      {n:'شیک وانیل', p:'۷۰,۰۰۰'},
      {n:'شیک شکلات', p:'۷۵,۰۰۰'},
      {n:'شیک نوتلا', p:'۸۰,۰۰۰'}
    ]},
    icecream: {title:'بستنی', a:'#4E85A0', b:'#26485A', items:[
      {n:'بستنی وانیل', p:'۵۵,۰۰۰'},
      {n:'بستنی شکلات', p:'۵۵,۰۰۰'},
      {n:'ساندی بستنی', p:'۷۰,۰۰۰'}
    ]}
  };

  function pageHTML(cat){
    var c = CATS[cat];
    var rows = c.items.map(function(it){
      return '<div class="item"><div class="item-top"><span class="item-name">'+it.n+'</span><span class="leader"></span><span class="price">'+it.p+'</span></div>'+
        (it.d ? '<div class="item-desc">'+it.d+'</div>' : '')+'</div>';
    }).join('');
    return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">'+
      '<title>'+c.title+' | کافه بلوط</title>'+
      '<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">'+
      '<style>'+
      'body{font-family:"Vazirmatn",sans-serif;background:linear-gradient(180deg,#6E4423,#2E1C10 60%);margin:0;min-height:100vh;display:flex;justify-content:center;color:#2A1B10}'+
      '.wrap{width:100%;max-width:480px;padding:24px 16px 50px}'+
      '.head{background:linear-gradient(160deg,'+c.a+','+c.b+');color:#F2E4C7;border-radius:10px;padding:22px;text-align:center;margin-bottom:16px;position:relative}'+
      '.head h1{margin:0;font-size:1.3rem;font-weight:800}'+
      '.close-btn{position:absolute;top:12px;left:12px;background:transparent;border:1.5px solid #C89A63;color:#F2E4C7;border-radius:8px;padding:6px 12px;font-family:"Vazirmatn",sans-serif;font-size:.8rem;cursor:pointer}'+
      '.box{background:#F2E4C7;border-radius:10px;padding:6px 18px 8px}'+
      '.item{padding:12px 0;border-bottom:1px dashed #EAD9B4}'+
      '.item:last-child{border-bottom:none}'+
      '.item-top{display:flex;align-items:baseline;gap:8px}'+
      '.item-name{font-weight:700;font-size:.96rem;white-space:nowrap}'+
      '.leader{flex:1;border-bottom:1px dotted #B8996B;transform:translateY(-3px)}'+
      '.price{font-weight:700;font-size:.92rem;color:#A2481C;white-space:nowrap}'+
      '.item-desc{font-size:.76rem;color:#6B5A44;margin-top:3px;line-height:1.5}'+
      '</style></head><body><div class="wrap"><div class="head"><button class="close-btn" onclick="window.close()">بازگشت</button><h1>'+c.title+'</h1></div><div class="box">'+rows+'</div></div></body></html>';
  }

  document.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('click', function(){
      var win = window.open('', '_blank');
      if(win){
        win.document.write(pageHTML(t.dataset.cat));
        win.document.close();
      } else {
        alert('مرورگرتون باز شدن پنجره جدید رو مسدود کرده. لطفاً پاپ‌آپ رو برای این سایت فعال کنید.');
      }
    });
  });

  try{
    new QRCode(document.getElementById('qr'), {
      text: window.location.href, width: 80, height: 80,
      colorDark: '#2E1C10', colorLight: '#ffffff'
    });
  }catch(e){
    document.getElementById('qr').innerText = '—';
  }
</script>
</body>
</html>
